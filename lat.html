<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>격자식 곱셈 · Lattice Multiplication</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#080810;--surface:#10101c;--card:#16162a;--border:#252540;--text:#e8e8f8;--red:#ff4d6d;--teal:#00f5c4;--gold:#ffd166;--green:#06ffa5;--purple:#c77dff;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.wrap{max-width:1100px;margin:0 auto;padding:4px 10px 24px;}
header{text-align:center;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px;}
.header-inner{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.logo-wrap{position:relative;width:40px;height:40px;flex-shrink:0;}
.logo-wrap svg{width:40px;height:40px;border-radius:50%;}
.logo-glow{position:absolute;inset:-6px;border-radius:50%;filter:blur(8px);transition:all .6s;pointer-events:none;}
.logo-wrap.glowing svg{filter:drop-shadow(0 0 10px #00f5c4) drop-shadow(0 0 22px #ffd166);}
.logo-wrap.glowing .logo-glow{background:radial-gradient(circle,rgba(0,245,196,.6) 0%,rgba(255,209,102,.3) 60%,transparent 100%);}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 6px #00f5c4) drop-shadow(0 0 14px #ffd166);}50%{filter:drop-shadow(0 0 20px #ffd166) drop-shadow(0 0 40px #00f5c4);}}
.logo-wrap.fanfare svg{animation:logoPulse .35s ease-in-out 6;}
.title-ko{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:900;background:linear-gradient(90deg,var(--teal),var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.title-en{font-size:0.7rem;color:#7878a8;}
.subtitle-row{color:#a0a0c0;font-size:0.6rem;margin-top:3px;text-align:center;}
.input-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px 10px;margin-bottom:6px;}
.num-inputs{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
.num-field{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;width:120px;text-align:center;background:#0a0a16;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 8px;outline:none;}
.num-field:focus{border-color:var(--teal);box-shadow:0 0 8px rgba(0,245,196,.4);}
.times-sign{font-size:1.8rem;font-weight:900;color:var(--red);}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:10px;}
.go-btn,.reset-btn{padding:6px 16px;border-radius:8px;font-weight:900;cursor:pointer;min-height:36px;font-size:0.82rem;}
.go-btn{background:linear-gradient(135deg,#00f5c4,#06ffa5);color:#0a0a16;border:none;}
.reset-btn{background:#2a2a44;color:#a0a0c8;border:1px solid var(--border);}
.range-hint{text-align:center;font-size:0.65rem;color:#6868a0;margin-top:5px;}
.input-error{text-align:center;font-size:0.8rem;font-weight:700;color:var(--red);margin-top:6px;min-height:1.2em;}
.controls{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px 8px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
.playback{display:flex;gap:10px;}
.ctrl-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;cursor:pointer;}
.ctrl-btn.active{background:var(--teal);color:var(--bg);}
.ctrl-btn:disabled{opacity:0.3;cursor:not-allowed;}
.slider-group{display:flex;align-items:center;gap:6px;padding:2px 8px;background:var(--surface);border-radius:30px;}
input[type=range]{-webkit-appearance:none;width:70px;height:4px;background:var(--border);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--teal);cursor:pointer;}
.slider-val,.step-indicator{font-family:'Space Mono',monospace;font-size:0.72rem;font-weight:700;color:var(--teal);}
.step-indicator{background:var(--surface);padding:3px 8px;border-radius:30px;color:#a0a0c0;}
.stage{display:flex;flex-direction:row;gap:16px;align-items:flex-start;}
.canvas-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;flex:1;min-width:0;}
.prob-title-row{text-align:center;margin-bottom:4px;min-height:32px;}
.prob-title{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:700;visibility:hidden;display:inline-block;}
.prob-title .op{color:var(--red);}
.canvas-area{display:flex;flex-direction:row;gap:12px;align-items:flex-start;}
.canvas-wrapper{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;padding:4px 0;}
#cv{display:block;border-radius:8px;max-width:100%;}
.legend{display:flex;flex-direction:column;gap:8px;font-size:0.7rem;color:#a0a0c0;flex-shrink:0;padding-top:8px;}
.leg{display:flex;align-items:center;gap:6px;}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.calc-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;width:280px;flex-shrink:0;}
#calc-rows{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.calc-card h3{font-size:0.7rem;color:#a0a0c0;border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:10px;}
.calc-row{font-family:'Space Mono',monospace;font-size:0.8rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;opacity:0;transform:translateX(-5px);transition:all 0.2s;}
.calc-row.show{opacity:1;transform:translateX(0);}
.c-sum{color:var(--gold);font-weight:700;}
.c-carry{color:var(--red);font-size:0.7rem;}
.calc-divider{border:none;border-top:1px solid var(--border);margin:10px 0;opacity:0;}
.calc-final{font-family:'Space Mono',monospace;font-weight:700;color:var(--green);display:none;text-align:center;}
.calc-final.show{display:block;}
#confetti-cv{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;display:none;}
/* 툴바 */
.toolbar{display:flex;justify-content:center;align-items:center;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;flex-wrap:wrap;gap:6px 10px;}
.toolbar-row{display:flex;gap:8px;justify-content:center;}
.tbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--border);border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);transition:background .15s;white-space:nowrap;}
.tbtn:active{opacity:.8;}
.tbtn.primary{background:linear-gradient(135deg,var(--teal),var(--green));color:#0a0a16;border-color:var(--teal);}
.tbtn-copied{background:#dcfce7!important;color:#15803d!important;border-color:#86efac!important;}
/* 입력 */
.num-inputs{display:flex;flex-direction:column;gap:8px;align-items:center;}
.num-inputs-row{display:flex;gap:10px;align-items:center;justify-content:center;}
.btn-row{display:flex;gap:8px;justify-content:center;width:100%;}
.go-btn,.reset-btn{flex:1;max-width:150px;}
/* 캔버스 */
.canvas-wrapper{flex:1;min-width:0;max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;padding:2px 0;}
/* 반응형 */
@media(max-width:750px){
.wrap{padding:4px 6px 20px;}
.header-inner{gap:8px;}
.logo-wrap{width:44px;height:44px;}
.logo-wrap svg{width:44px;height:44px;}
.subtitle-row{font-size:0.6rem;}
.toolbar{padding:5px 6px;gap:5px;}
.toolbar-row{width:100%;justify-content:center;gap:6px;}
.tbtn{padding:5px 10px;font-size:0.68rem;}
.input-panel{padding:8px;}
.num-field{width:100px;font-size:1.1rem;padding:7px;}
.times-sign{font-size:1.4rem;}
.go-btn,.reset-btn{min-height:40px;font-size:0.82rem;padding:8px 12px;}
.controls{padding:6px 8px;gap:6px;}
.ctrl-btn{width:40px;height:40px;font-size:1rem;}
input[type=range]{width:65px;}
.step-indicator{font-size:0.72rem;padding:4px 8px;}
.slider-group{padding:3px 8px;gap:6px;}
.stage{flex-direction:column;}
.canvas-card{padding:8px;width:100%;box-sizing:border-box;}
.canvas-area{flex-direction:column;}
.canvas-wrapper{width:100%;justify-content:center;overflow-x:hidden;}
.prob-title{font-size:1rem;}
.calc-card{width:100%;margin-top:6px;padding:8px;}
.calc-card h3{font-size:0.65rem;}
.calc-row{font-size:0.72rem;}
#calc-rows{max-height:200px;}
.legend{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;padding-top:8px;margin-top:6px;border-top:1px solid var(--border);font-size:0.62rem;}
}
@media(max-width:430px){
.tbtn{padding:4px 8px;font-size:0.62rem;}
.num-field{width:88px;font-size:1rem;padding:6px;}
.times-sign{font-size:1.2rem;}
.ctrl-btn{width:36px;height:36px;font-size:0.9rem;}
input[type=range]{width:55px;}
}
</style>
</head>
<body>
<canvas id="confetti-cv"></canvas>
<div class="wrap">
<header>
<div class="header-inner">
<div class="logo-wrap" id="logo-wrap">
<div class="logo-glow"></div>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs><linearGradient id="lg1"><stop offset="0%" stop-color="#00b4d8"/><stop offset="100%" stop-color="#06ffa5"/></linearGradient>
<path id="arcT" d="M14,40 A26,26 0 0,1 66,40"/><path id="arcB" d="M9,40 A31,31 0 0,0 71,40"/>
<filter id="glow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle cx="40" cy="40" r="38" fill="url(#lg1)" stroke="#00a8cc" stroke-width="1.5"/>
<text font-family="Arial" font-size="7.5" fill="white"><textPath href="#arcT" startOffset="50%" text-anchor="middle">NAEMANG2943</textPath></text>
<text font-family="Arial" font-size="7.5" fill="white"><textPath href="#arcB" startOffset="50%" text-anchor="middle">SJL0108</textPath></text>
<text x="40" y="30" font-family="'Noto Sans KR'" font-size="16" font-weight="900" fill="#ffe566" text-anchor="middle" filter="url(#glow)">ㅇ</text>
<text x="40" y="43" font-family="'Noto Sans KR'" font-size="16" font-weight="900" fill="#ffe566" text-anchor="middle" filter="url(#glow)">ㅡ</text>
<text x="40" y="56" font-family="'Noto Sans KR'" font-size="16" font-weight="900" fill="#ffe566" text-anchor="middle" filter="url(#glow)">ㄴ</text>
</svg>
</div>
<div class="title-block"><div class="title-ko">격자식 곱셈</div><div class="title-en">Lattice Multiplication</div></div>
</div>
<p class="subtitle-row">각 칸에 두 자리 곱을 채우고, 대각선 방향으로 합산 + 받아올림<br><span style="font-size:0.55rem;opacity:0.7;">Fill each cell with two-digit products, then sum diagonally + carry</span></p>
</header>
<div class="toolbar">
  <div class="toolbar-row">
    <button class="tbtn primary" onclick="openNewTab()">🚀 새 탭 New Tab</button>
    <button class="tbtn primary" onclick="downloadApp()">💾 저장 Save</button>
  </div>
  <div class="toolbar-row">
    <button class="tbtn" onclick="copyCode(this)">📋 코드 복사 Copy Code</button>
    <button class="tbtn" onclick="copyScreen(this)">🖼 화면 복사 Copy Screen</button>
  </div>
</div>
<div class="input-panel">
<div class="num-inputs">
<div class="num-inputs-row">
<input class="num-field" id="f1" type="number" inputmode="numeric" value="">
<span class="times-sign">×</span>
<input class="num-field" id="f2" type="number" inputmode="numeric" value="">
</div>
<div class="btn-row">
<button class="go-btn" id="drawBtn">그리기 Draw</button>
<button class="reset-btn" id="resetBtn">초기화 Reset</button>
</div>
</div>
<div class="range-hint">1 ~ 9,999,999 · 최대 7자리 Up to 7 digits</div>
<div class="input-error" id="input-error"></div>
</div>
<div class="controls">
<div class="playback"><button class="ctrl-btn" id="btn-prev" disabled>⏮</button><button class="ctrl-btn" id="btn-play" disabled>▶</button><button class="ctrl-btn" id="btn-next" disabled>⏭</button></div>
<span class="step-indicator" id="step-ind">— / —</span>
<div class="slider-group"><span>⚡</span><input type="range" id="speed-sl" min="1" max="5" value="3"><span class="slider-val" id="speed-val">3</span></div>
<div class="slider-group"><span>🔊</span><input type="range" id="vol-sl" min="0" max="10" value="5"><span class="slider-val" id="vol-val">5</span></div>
</div>
<div class="stage">
<div class="canvas-card">
<div class="prob-title-row"><div class="prob-title" id="prob-title"><span id="pt1"></span><span class="op"> × </span><span id="pt2"></span></div></div>
<div class="canvas-area"><div class="canvas-wrapper" id="canvasWrapper"><canvas id="cv"></canvas></div>
<div class="legend"><div class="leg"><span class="leg-dot" style="background:#67c7eb"></span><span>십의 자리 Tens</span></div><div class="leg"><span class="leg-dot" style="background:#ffd166"></span><span>일의 자리 Ones</span></div><div class="leg"><span class="leg-dot" style="background:#67c7eb"></span><span>대각합 Diag Sum</span></div></div></div>
</div>
<div class="calc-card"><h3>📐 계산 과정 · Work</h3><div id="calc-rows"></div><hr class="calc-divider" id="calc-divider"><div class="calc-final" id="calc-final"></div></div>
</div>
</div>
<script>
let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
let VOL=0.5;
function tone(f,dur,vol,tp='sine',dl=0){if(!VOL)return;const ac=getAC();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=tp;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(0,ac.currentTime+dl);g.gain.linearRampToValueAtTime(vol*VOL,ac.currentTime+dl+.01);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+dur);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+dur+.05);}
function sndCell(){tone(440+Math.random()*60,.07,.08,'triangle');}
function sndDiag(i){tone(540+i*45,.12,.1,'sine');}
function sndCarry(){tone(740,.1,.11,'sine');}
function sndFanfare(){[[523,0],[659,.13],[784,.26],[1047,.4],[784,.53],[1047,.66],[1318,.8]].forEach(([f,d])=>tone(f,.2,.12,'triangle',d));}
let steps=[],stepIdx=0,isPlaying=false,autoId=null;
let curN1=0,curN2=0,d1=[],d2=[];
let GEO=null;
let rawDiag=[],finDiag=[],ND=0;
let canvasState=null;
let CW=0,CH=0;
let carryAnimId=null,carryProgress=0;
let SPEED_MS=220,resizeTimer=null;
function digs(n){return String(n).split('').map(Number);}
function calcDiags(d1,d2){const cols=d1.length,rows=d2.length,nd=cols+rows;const raw=new Array(nd).fill(0);for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){const p=d1[c]*d2[r];raw[c+r]+=Math.floor(p/10);raw[c+r+1]+=p%10;}const fin=[...raw];for(let d=nd-1;d>0;d--){if(fin[d]>=10){fin[d-1]+=Math.floor(fin[d]/10);fin[d]%=10;}}return{raw,fin,nd};}
function freshState(){return{gridDrawn:false,cells:[],highlightCell:null,diagSet:new Set(),showCarry:false,showAnswer:false};}
function diagPos(d,cols,rows,ox,oy,C,GAP,BS,gw){if(d<rows)return{x:ox-GAP-BS/2,y:oy+d*C+C/2,side:'left'};else{const col=d-rows;if(col>=cols)return{x:ox+gw+26,y:oy+rows*C+GAP+BS/2,side:'right'};return{x:ox+col*C+C/2,y:oy+rows*C+GAP+BS/2,side:'bottom'};}}
function render(){if(!GEO||!canvasState)return;const cv=document.getElementById('cv');if(!cv||CW===0||CH===0)return;const ctx=cv.getContext('2d');const st=canvasState;const{cols,rows,C,DC,ox,oy,gw,gh,GAP,BS,nd,diagStart,gridDiagGap,diagCarryGap,carryAnsGap}=GEO;ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#07070f';ctx.fillRect(0,0,CW,CH);
if(st.gridDrawn){ctx.strokeStyle='rgba(160,180,255,.9)';ctx.lineWidth=2;ctx.strokeRect(ox,oy,gw,gh);ctx.strokeStyle='rgba(110,125,200,.4)';ctx.lineWidth=1;for(let c=1;c<cols;c++){ctx.beginPath();ctx.moveTo(ox+c*C,oy);ctx.lineTo(ox+c*C,oy+gh);ctx.stroke();}for(let r=1;r<rows;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*C);ctx.lineTo(ox+gw,oy+r*C);ctx.stroke();}ctx.strokeStyle='rgba(140,155,230,.3)';for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){ctx.beginPath();ctx.moveTo(ox+(c+1)*C,oy+r*C);ctx.lineTo(ox+c*C,oy+(r+1)*C);ctx.stroke();}ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${Math.max(14,Math.round(C*0.45))}px 'Space Mono',monospace`;for(let c=0;c<cols;c++){ctx.fillStyle='#ff9f1c';ctx.fillText(d1[c],ox+c*C+C/2,oy-18);}const d2x=ox+gw+18;for(let r=0;r<rows;r++){ctx.fillStyle='#00f5c4';ctx.fillText(d2[r],d2x,oy+r*C+C/2);}}
ctx.textAlign='center';ctx.textBaseline='middle';st.cells.forEach(({c,r})=>{const p=d1[c]*d2[r];const tens=Math.floor(p/10),ones=p%10;const cx=ox+c*C,cy=oy+r*C;ctx.font=`bold ${Math.max(11,Math.round(C*0.28))}px 'Space Mono',monospace`;ctx.fillStyle='#67c7eb';ctx.fillText(tens,cx+C*0.28,cy+C*0.3);ctx.fillStyle='#ffd166';ctx.fillText(ones,cx+C*0.72,cy+C*0.7);});
if(st.highlightCell){const{c,r}=st.highlightCell;ctx.strokeStyle='#c77dff';ctx.lineWidth=2.5;ctx.strokeRect(ox+c*C+2,oy+r*C+2,C-4,C-4);}
if(st.diagSet.size>0){
  const yBase=oy+gh+gridDiagGap;
  /* 격자 가장자리 인덱스 */
  const idxFS=Math.max(9,Math.round(C*0.3));
  ctx.font=`bold ${idxFS}px 'Space Mono',monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let d=0;d<ND;d++){
    if(!st.diagSet.has(d))continue;
    if(d<rows){ctx.fillStyle='rgba(199,125,255,.85)';ctx.fillText(rawDiag[d],ox-18,oy+d*C+C/2);}
    else{const col=d-rows;if(col<cols){ctx.fillStyle='rgba(199,125,255,.85)';ctx.fillText(rawDiag[d],ox+col*C+C/2,oy+gh+16);}}
  }
  /* 레이블 */
  ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font='bold 9px "Noto Sans KR",sans-serif';ctx.fillStyle='#67c7eb';ctx.fillText('대각합',4,yBase-4);
  ctx.font='bold 7px "Space Mono",monospace';ctx.fillStyle='rgba(199,125,255,.7)';ctx.fillText('Diag Sum',4,yBase+5);ctx.restore();
  /* 숫자 행 */
  const dFS=Math.max(10,Math.min(13,Math.round(DC*0.35)));
  ctx.font=`bold ${dFS}px 'Space Mono',monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let d=0;d<ND;d++){if(!st.diagSet.has(d))continue;ctx.fillStyle='#67c7eb';ctx.fillText(rawDiag[d],diagStart+d*DC,yBase);}
}
if(st.showCarry){
  const yBase=oy+gh+gridDiagGap+diagCarryGap;
  ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font='bold 9px "Noto Sans KR",sans-serif';ctx.fillStyle='#06ffa5';ctx.fillText('받아올림',4,yBase-4);
  ctx.font='bold 7px "Space Mono",monospace';ctx.fillStyle='rgba(6,255,165,.7)';ctx.fillText('Carry',4,yBase+5);ctx.restore();
  /* DC 기반 폰트 크기 */
  const cFS=Math.max(10,Math.min(14,Math.round(DC*0.4)));
  const cFSsm=Math.max(8,Math.min(12,Math.round(DC*0.3)));
  const seq=[];const tmp=[...rawDiag];for(let d=ND-1;d>0;d--){if(tmp[d]>=10){const cv=Math.floor(tmp[d]/10);seq.push({d,orig:tmp[d],carry:cv,result:tmp[d]%10});tmp[d-1]+=cv;tmp[d]%=10;}}const total=seq.length;const rs=Math.min(carryProgress*total,total);const done=Math.min(Math.floor(rs),total);const frac=done<total?rs-done:0;const curVals=[...rawDiag];for(let s=0;s<done;s++){curVals[seq[s].d]=seq[s].result;curVals[seq[s].d-1]+=seq[s].carry;}const activeSeq=done<total?seq[done]:null;for(let d=0;d<ND;d++){const x=diagStart+d*DC;const seqIdx=seq.findIndex(s=>s.d===d);const isDone=seqIdx>=0&&seqIdx<done;const isActive=activeSeq&&activeSeq.d===d;if(isActive){const orig=curVals[d],result=activeSeq.result,carry=activeSeq.carry;if(frac<0.3){ctx.font=`bold ${cFS}px "Space Mono",monospace`;ctx.fillStyle='#ffd166';ctx.fillText(orig,x,yBase);}else{ctx.font=`bold ${cFSsm}px "Space Mono",monospace`;ctx.fillStyle='rgba(255,209,102,.5)';ctx.fillText(orig,x,yBase-10);if(frac>0.65){const al=Math.min(1,(frac-0.65)*2.5);ctx.font=`bold ${cFS}px "Space Mono",monospace`;ctx.fillStyle=`rgba(6,255,165,${al})`;ctx.fillText(result,x,yBase+5);}}if(frac>0.25&&d-1>=0){const axL=diagStart+(d-1)*DC;const af=Math.min(1,(frac-0.25)/0.55);const sy=yBase+25;const sx=x-4,ex=axL+4;const cx2=sx+(ex-sx)*af;ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(cx2,sy);ctx.stroke();ctx.setLineDash([]);if(af>=0.95){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(ex,sy);ctx.lineTo(ex+8,sy-4);ctx.lineTo(ex+8,sy+4);ctx.closePath();ctx.fill();}const labelAlpha=frac<0.75?1:Math.max(0,1-(frac-0.75)/0.25);ctx.font=`bold ${cFSsm}px "Space Mono",monospace`;const lbl='+'+carry;const lx=(sx+cx2)/2,ly=sy-12;ctx.fillStyle=`rgba(255,209,102,${0.2*labelAlpha})`;ctx.fillText(lbl,lx,ly);ctx.fillStyle=`rgba(255,230,80,${labelAlpha})`;ctx.fillText(lbl,lx,ly);}}else if(isDone){ctx.font=`bold ${cFS}px "Space Mono",monospace`;ctx.fillStyle='#06ffa5';ctx.fillText(finDiag[d],x,yBase);}else{ctx.font=`bold ${cFS}px "Space Mono",monospace`;ctx.fillStyle='#c77dff';ctx.fillText(curVals[d],x,yBase);}}}
if(st.showAnswer){const ansY=oy+gh+gridDiagGap+(st.showCarry?diagCarryGap+carryAnsGap+15:carryAnsGap+15);const aFS=Math.max(18,Math.min(28,Math.round(CW*0.065)));ctx.font=`bold ${aFS}px 'Space Mono',monospace`;ctx.fillStyle='#06ffa5';ctx.textAlign='center';ctx.fillText('∴ '+(curN1*curN2),CW/2,ansY);}}
function startCarryAnim(onDone){if(carryAnimId)cancelAnimationFrame(carryAnimId);carryProgress=0;const cnt=rawDiag.filter((v,i)=>v!==finDiag[i]).length;const dur=Math.max(2000,cnt*1600);const start=performance.now();function tick(now){carryProgress=Math.min(1,(now-start)/dur);render();if(carryProgress<1)carryAnimId=requestAnimationFrame(tick);else{carryAnimId=null;if(onDone)onDone();}}carryAnimId=requestAnimationFrame(tick);}
function addCalcRow(d){if(document.getElementById('cr-'+d))return;const cols=d1.length,rows=d2.length;const points=[];for(let c=0;c<cols;c++){const rT=d-c;if(rT>=0&&rT<rows)points.push({v:Math.floor(d1[c]*d2[rT]/10),color:'#67c7eb'});const rO=d-1-c;if(rO>=0&&rO<rows)points.push({v:d1[c]*d2[rO]%10,color:'#ffd166'});}const raw=rawDiag[d],fin=finDiag[d];const row=document.createElement('div');row.className='calc-row';row.id='cr-'+d;const addendsHtml=points.length?points.map(p=>`<span style="color:${p.color};font-weight:700;">${p.v}</span>`).join('<span class="c-eq">+</span>'):'0';row.innerHTML=`${addendsHtml} <span class="c-eq">=</span> <span class="c-sum">${raw}</span>${raw!==fin?`<span class="c-carry"> → ${fin}</span>`:''}`;document.getElementById('calc-rows').appendChild(row);setTimeout(()=>row.classList.add('show'),10);}
function doFinal(silent=false){canvasState.showAnswer=true;document.getElementById('calc-divider').style.opacity='1';const fe=document.getElementById('calc-final');fe.innerHTML=`<div style="font-size:0.8rem;opacity:0.7;">${curN1} × ${curN2}</div><div style="font-size:1.3rem;">∴ ${curN1*curN2}</div>`;fe.style.display='block';setTimeout(()=>fe.classList.add('show'),10);if(!silent){sndFanfare();launchConfetti();const logo=document.getElementById('logo-wrap');logo.classList.add('fanfare','glowing');setTimeout(()=>logo.classList.remove('fanfare'),2300);setTimeout(()=>logo.classList.remove('glowing'),4200);}}
/* 꽃비(confetti) 효과 */
function launchConfetti(){
  const cv=document.getElementById('confetti-cv');
  if(!cv)return;
  cv.style.display='block';
  cv.width=window.innerWidth;
  cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const colors=['#ff4d6d','#00f5c4','#ffd166','#06ffa5','#c77dff','#67c7eb'];
  const particles=[];
  for(let i=0;i<120;i++){
    particles.push({
      x:Math.random()*cv.width,
      y:Math.random()*cv.height-cv.height,
      w:Math.random()*8+4,
      h:Math.random()*6+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      speed:Math.random()*3+2,
      swing:Math.random()*4-2,
      rot:Math.random()*360
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    particles.forEach(p=>{
      p.y+=p.speed;
      p.x+=Math.sin(frame*0.05+p.swing)*0.5;
      p.rot+=2;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(frame<180)requestAnimationFrame(draw);
    else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none';}
  }
  draw();
}
function buildSteps(){const list=[];const cols=d1.length,rows=d2.length;list.push({t:'grid'});for(let k=0;k<cols+rows-1;k++)for(let c=0;c<cols;c++){const r=k-c;if(r>=0&&r<rows)list.push({t:'cell',c,r});}for(let d=0;d<ND;d++)list.push({t:'diag',d});if(rawDiag.some((v,i)=>v!==finDiag[i]))list.push({t:'carry'});list.push({t:'final'});return list;}
/* 캔버스 하단으로 부드럽게 스크롤 */
function scrollToCanvasBottom(){
  const cv=document.getElementById('cv');
  if(!cv)return;
  const rect=cv.getBoundingClientRect();
  const cvBottom=rect.bottom;
  const viewH=window.innerHeight;
  /* 캔버스 하단이 화면 밖에 있으면 스크롤 */
  if(cvBottom>viewH-20){
    const scrollTarget=window.scrollY+(cvBottom-viewH)+60;
    window.scrollTo({top:scrollTarget,behavior:'smooth'});
  }
}
function applyStep(idx){if(idx<0||idx>=steps.length)return;const s=steps[idx];if(s.t==='grid')canvasState.gridDrawn=true;if(s.t==='cell'){canvasState.cells.push({c:s.c,r:s.r});canvasState.highlightCell={c:s.c,r:s.r};sndCell();}if(s.t==='diag'){canvasState.highlightCell=null;canvasState.diagSet.add(s.d);sndDiag(s.d);addCalcRow(s.d);if(s.d===0)scrollToCanvasBottom();}if(s.t==='carry'){canvasState.showCarry=true;sndCarry();scrollToCanvasBottom();const wp=isPlaying;if(wp){stopAutoPlay();isPlaying=false;document.getElementById('btn-play').textContent='▶';document.getElementById('btn-play').classList.remove('active');}startCarryAnim(()=>{if(wp){isPlaying=true;document.getElementById('btn-play').textContent='⏸';document.getElementById('btn-play').classList.add('active');startAutoPlay();}});}if(s.t==='final'){doFinal();scrollToCanvasBottom();}render();updateUI();}
function rebuildState(upTo){canvasState=freshState();carryProgress=1;document.getElementById('calc-rows').innerHTML='';document.getElementById('calc-divider').style.opacity='0';document.getElementById('calc-final').style.display='none';document.getElementById('calc-final').classList.remove('show');for(let i=0;i<upTo;i++){const s=steps[i];if(s.t==='grid')canvasState.gridDrawn=true;if(s.t==='cell'){canvasState.cells.push({c:s.c,r:s.r});canvasState.highlightCell={c:s.c,r:s.r};}if(s.t==='diag'){canvasState.highlightCell=null;canvasState.diagSet.add(s.d);addCalcRow(s.d);}if(s.t==='carry')canvasState.showCarry=true;if(s.t==='final')doFinal(true);}render();updateUI();}
function stepForward(){if(stepIdx<steps.length){applyStep(stepIdx);stepIdx++;}}
function stepBack(){if(stepIdx>0){stepIdx--;rebuildState(stepIdx);}}
function togglePlay(){getAC().resume();isPlaying=!isPlaying;const btn=document.getElementById('btn-play');btn.textContent=isPlaying?'⏸':'▶';btn.classList.toggle('active',isPlaying);if(isPlaying)startAutoPlay();else stopAutoPlay();}
function startAutoPlay(){stopAutoPlay();function tick(){if(!isPlaying||stepIdx>=steps.length){isPlaying=false;document.getElementById('btn-play').textContent='▶';document.getElementById('btn-play').classList.remove('active');return;}stepForward();autoId=setTimeout(tick,SPEED_MS);}autoId=setTimeout(tick,SPEED_MS);}
function stopAutoPlay(){if(autoId){clearTimeout(autoId);autoId=null;}}
function updateUI(){const tot=steps.length;document.getElementById('step-ind').textContent=`${stepIdx} / ${tot}`;document.getElementById('btn-prev').disabled=stepIdx===0;document.getElementById('btn-next').disabled=stepIdx>=tot;if(stepIdx>=tot&&isPlaying){isPlaying=false;document.getElementById('btn-play').textContent='▶';document.getElementById('btn-play').classList.remove('active');stopAutoPlay();}}
function initDraw(){const v1=parseInt(document.getElementById('f1').value);const v2=parseInt(document.getElementById('f2').value);const errEl=document.getElementById('input-error');if(isNaN(v1)||isNaN(v2)){errEl.textContent='⚠ 숫자를 입력해 주세요';return;}if(v1<1||v2<1||v1>9999999||v2>9999999){errEl.textContent='⚠ 1 ~ 9,999,999 사이의 숫자를 입력하세요';return;}errEl.textContent='';stopAutoPlay();isPlaying=false;if(carryAnimId){cancelAnimationFrame(carryAnimId);carryAnimId=null;}carryProgress=0;curN1=v1;curN2=v2;d1=digs(v1);d2=digs(v2);document.getElementById('pt1').textContent=v1;document.getElementById('pt2').textContent=v2;document.getElementById('prob-title').style.visibility='visible';document.getElementById('calc-rows').innerHTML='';document.getElementById('calc-divider').style.opacity='0';document.getElementById('calc-final').style.display='none';const res=calcDiags(d1,d2);rawDiag=res.raw;finDiag=res.fin;ND=res.nd;const cols=d1.length,rows=d2.length;const wrapper=document.getElementById('canvasWrapper');
  /* 모바일에서 안정적인 너비 계산 - 다른 패널들과 통일 */
  const canvasCard=document.querySelector('.canvas-card');
  const inputPanel=document.querySelector('.input-panel');
  const refW=inputPanel?inputPanel.clientWidth:(canvasCard?canvasCard.clientWidth:window.innerWidth-12);
  const cardPadding=16; /* canvas-card padding 8px * 2 */
  const rawW=Math.max(refW-cardPadding,Math.min(window.innerWidth-20,280));
  CW=Math.floor(Math.min(700,rawW));
  _lastW=rawW;
  _lastH=window.innerHeight;
  _lastOrientation=window.screen?.orientation?.angle??window.orientation??0;
  /* 상수 */
  const GAP=8,BS=18,topM=42;
  const gridDiagGap=52; /* 격자 ~ 대각합 */
  const diagCarryGap=32;/* 대각합 ~ 받아올림 */
  const carryAnsGap=30; /* 받아올림 ~ 답 */
  const diagLabelW=60;  /* 레이블 폭 */
  /* 격자 좌우 여백: 왼쪽(대각합 인덱스), 오른쪽(d2 숫자) 동일하게 */
  const sideMargin=32;
  /* 셀 크기: 최대 46px */
  let C=Math.floor((CW-sideMargin*2)/Math.max(cols,rows));
  C=Math.max(20,Math.min(C,46));
  const gw=cols*C,gh=rows*C;
  /* 격자 중앙 정렬 - 좌우 여백 동일 */
  const ox=Math.round((CW-gw)/2);
  const oy=topM;
  /* DC: 모든 ND개 숫자가 캔버스 안에 들어가도록 계산 */
  const rightPadding=20;
  const availableWidth=CW-diagLabelW-rightPadding;
  const DC=ND>1?Math.max(18,Math.floor(availableWidth/(ND-1))):30;
  /* 대각합 행 - 왼쪽 정렬로 잘림 방지 */
  const diagStart=diagLabelW+4;
  const hasCarry=rawDiag.some((v,i)=>v!==finDiag[i]);
  CH=oy+gh+gridDiagGap+(hasCarry?diagCarryGap+carryAnsGap:0)+carryAnsGap+45;
  const cv=document.getElementById('cv');
  cv.width=CW;cv.height=CH;cv.style.width=CW+'px';cv.style.height=CH+'px';
  GEO={cols,rows,C,DC,ox,oy,gw,gh,GAP,BS,nd:ND,diagStart,gridDiagGap,diagCarryGap,carryAnsGap};steps=buildSteps();stepIdx=0;canvasState=freshState();document.getElementById('btn-play').disabled=false;document.getElementById('btn-next').disabled=false;document.getElementById('btn-prev').disabled=true;render();updateUI();isPlaying=true;document.getElementById('btn-play').textContent='⏸';document.getElementById('btn-play').classList.add('active');startAutoPlay();}
function resetAll(){stopAutoPlay();if(carryAnimId){cancelAnimationFrame(carryAnimId);carryAnimId=null;}isPlaying=false;document.getElementById('btn-play').textContent='▶';document.getElementById('btn-play').classList.remove('active');document.getElementById('btn-play').disabled=true;document.getElementById('btn-next').disabled=true;document.getElementById('btn-prev').disabled=true;document.getElementById('step-ind').textContent='— / —';document.getElementById('f1').value='';document.getElementById('f2').value='';document.getElementById('input-error').textContent='';document.getElementById('prob-title').style.visibility='hidden';document.getElementById('calc-rows').innerHTML='';document.getElementById('calc-divider').style.opacity='0';document.getElementById('calc-final').style.display='none';const cv=document.getElementById('cv');const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);steps=[];stepIdx=0;GEO=null;canvasState=null;}
document.getElementById('drawBtn').onclick=initDraw;
document.getElementById('resetBtn').onclick=resetAll;
document.getElementById('btn-prev').onclick=stepBack;
document.getElementById('btn-play').onclick=togglePlay;
document.getElementById('btn-next').onclick=stepForward;
document.getElementById('speed-sl').oninput=function(e){const val=parseInt(e.target.value);const map={1:550,2:330,3:220,4:110,5:40};SPEED_MS=map[val];document.getElementById('speed-val').textContent=val;if(isPlaying)startAutoPlay();};
document.getElementById('vol-sl').oninput=function(e){VOL=parseInt(e.target.value)/10;document.getElementById('vol-val').textContent=e.target.value;};
document.getElementById('f1').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('f2').focus();});
document.getElementById('f2').addEventListener('keydown',e=>{if(e.key==='Enter')initDraw();});
let _lastW=0;
let _lastH=0;
let _lastOrientation=window.screen?.orientation?.angle??window.orientation??0;

/* 모바일: 스크롤/터치 시 주소창 때문에 높이만 바뀌는 resize 무시 */
window.addEventListener('resize',()=>{
  if(!curN1||!curN2)return;
  
  const newOrientation=window.screen?.orientation?.angle??window.orientation??0;
  const orientationChanged=newOrientation!==_lastOrientation;
  _lastOrientation=newOrientation;
  
  const wr=document.getElementById('canvasWrapper');
  const nw=wr?wr.getBoundingClientRect().width:0;
  const nh=window.innerHeight;
  
  /* 방향 전환이면 무조건 다시 그림 */
  if(orientationChanged){
    _lastW=nw;_lastH=nh;
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const wp=isPlaying;if(wp){stopAutoPlay();isPlaying=false;}
      initDraw();
      if(wp&&stepIdx<steps.length){isPlaying=true;document.getElementById('btn-play').textContent='⏸';document.getElementById('btn-play').classList.add('active');startAutoPlay();}
    },350);
    return;
  }
  
  /* 너비 변화율 5% 미만이면 무시 (모바일 주소창으로 인한 미세 변화 방지) */
  const widthRatio=_lastW>0?Math.abs(nw-_lastW)/_lastW:1;
  if(widthRatio<0.05)return;
  
  _lastW=nw;_lastH=nh;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const wp=isPlaying;if(wp){stopAutoPlay();isPlaying=false;}
    initDraw();
    if(wp&&stepIdx<steps.length){isPlaying=true;document.getElementById('btn-play').textContent='⏸';document.getElementById('btn-play').classList.add('active');startAutoPlay();}
  },400);
});

/* ── 툴바 ── */
function flashBtn(b){b.classList.add('tbtn-copied');const o=b.textContent;b.textContent='✅ 복사됨!';setTimeout(()=>{b.classList.remove('tbtn-copied');b.textContent=o;},1800);}
function downloadApp(){const s=document.documentElement.outerHTML;const b=new Blob([s],{type:'text/html'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='격자식곱셈.html';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),3000);}
function openNewTab(){const s=document.documentElement.outerHTML;const b=new Blob([s],{type:'text/html'});window.open(URL.createObjectURL(b),'_blank');}
function copyCode(b){navigator.clipboard.writeText(document.documentElement.outerHTML).then(()=>flashBtn(b)).catch(()=>{const t=document.createElement('textarea');t.value=document.documentElement.outerHTML;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);flashBtn(b);});}
function copyScreen(b){const cv=document.getElementById('cv');if(!cv)return;cv.toBlob(blob=>{if(!blob)return;navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>flashBtn(b)).catch(()=>alert('최신 브라우저에서만 지원됩니다.'));});}
