<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>댐워치 관리자</title>
  <style>
    :root {
      --bg: #0a0d18;
      --bg2: #11142a;
      --surface: rgba(20,25,45,0.7);
      --border: rgba(150,160,200,0.18);
      --text: #e8eaf5;
      --text2: rgba(232,234,245,0.7);
      --text3: rgba(232,234,245,0.45);
      --accent: #4dc4ff;
      --accent2: #00d488;
      --danger: #ff6680;
      --warn: #ffaa44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header h1 .pre { color: var(--accent); margin-right: 6px; }

    /* 비밀번호 입력 화면 */
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 24px;
      max-width: 420px;
      margin: 60px auto;
      text-align: center;
    }
    .login-box h2 { font-size: 18px; margin-bottom: 8px; }
    .login-box p {
      font-size: 12.5px;
      color: var(--text2);
      margin-bottom: 22px;
      line-height: 1.7;
    }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #0096dd);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-box button:hover { opacity: 0.9; }
    .login-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 8px;
      min-height: 18px;
    }

    /* 통계 */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .stat .label { font-size: 10.5px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
    .stat .val { font-size: 22px; font-weight: 700; margin-top: 4px; font-family: monospace; }
    .stat.danger .val { color: var(--danger); }
    .stat.warn .val { color: var(--warn); }
    .stat.ok .val { color: var(--accent2); }

    /* 필터 */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-btn {
      padding: 7px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: rgba(77,196,255,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 카드 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
    }
    .card.hidden-card {
      opacity: 0.55;
      background: rgba(80,60,60,0.25);
      border-color: rgba(255,150,100,0.25);
    }
    .card .photo {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      overflow: hidden;
      cursor: pointer;
    }
    .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .photo.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 28px;
    }
    .card .body { flex: 1; min-width: 0; }
    .card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 10.5px;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .card .meta .dam-tag {
      color: var(--accent);
      font-weight: 600;
      font-family: monospace;
    }
    .card .nickname {
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card .note {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .card .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card .actions button {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
    }
    .card .actions button:hover { color: var(--text); }
    .card .actions .hide-btn { color: var(--warn); border-color: rgba(255,170,68,0.4); }
    .card .actions .unhide-btn { color: var(--accent2); border-color: rgba(0,212,136,0.4); }
    .card .actions .delete-btn { color: var(--danger); border-color: rgba(255,100,120,0.4); }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
      font-style: italic;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text3);
    }
    .err {
      background: rgba(255,100,120,0.1);
      border: 1px solid rgba(255,100,120,0.3);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 12.5px;
    }

    /* 큰 사진 보기 */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 로그아웃 버튼 */
    .logout {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- 로그인 화면 (기본) -->
  <div id="login-screen" class="login-box">
    <h2>🛡️ 댐워치 관리자</h2>
    <p>관리자 비밀번호를 입력해 주세요.<br>(Vercel 환경변수 <code style="color:var(--accent);font-family:monospace;font-size:11px;">ADMIN_PIN</code>에 설정한 값)</p>
    <div style="font-size:10.5px;color:var(--warn);margin-bottom:14px;background:rgba(255,170,68,0.08);padding:6px 10px;border-radius:6px;border:1px solid rgba(255,170,68,0.2);">
      💡 비밀번호는 보통 영문이에요. 입력 전 <strong>한/영 키</strong> 한 번 누르고, 👁️ 버튼으로 확인하세요.
    </div>
    <div style="position:relative;margin-bottom:12px;">
      <input type="password" id="pin-input" placeholder="비밀번호" autofocus
             style="margin-bottom:0;padding-right:48px;"
             onkeydown="if(event.key==='Enter')tryLogin()">
      <!-- 비밀번호 보기/숨기기 토글 -->
      <button type="button" onclick="togglePinVisibility()" aria-label="비밀번호 보기"
              style="position:absolute;right:6px;top:50%;transform:translateY(-50%);
                     background:none;border:none;color:var(--text2);font-size:20px;
                     cursor:pointer;padding:6px 10px;line-height:1;user-select:none;
                     border-radius:6px;transition:background 0.15s;"
              onmouseover="this.style.background='rgba(255,255,255,0.06)'"
              onmouseout="this.style.background='none'">
        <span id="eye-icon">👁️</span>
      </button>
    </div>
    <button onclick="tryLogin()">🔓 들어가기</button>
    <div class="login-error" id="login-err"></div>
  </div>

  <!-- 관리 화면 (로그인 후) -->
  <div id="admin-screen" style="display:none;">
    <div class="header">
      <h1><span class="pre">🛡️</span>댐워치 관리자</h1>
      <button class="logout" onclick="logout()">로그아웃</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><div class="label">TOTAL</div><div class="val" id="stat-total">–</div></div>
      <div class="stat ok"><div class="label">VISIBLE</div><div class="val" id="stat-visible">–</div></div>
      <div class="stat warn"><div class="label">HIDDEN</div><div class="val" id="stat-hidden">–</div></div>
      <div class="stat danger"><div class="label">REPORTED</div><div class="val" id="stat-reported">–</div></div>
      <div class="stat"><div class="label">PHOTOS</div><div class="val" id="stat-photos">–</div></div>
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="reported">🚩 신고됨</button>
      <button class="filter-btn" data-filter="visible">표시 중</button>
      <button class="filter-btn" data-filter="hidden">숨김</button>
      <button class="filter-btn" data-filter="photo">사진만</button>
      <button class="filter-btn" data-filter="note">코멘트만</button>
    </div>

    <div id="contrib-list"></div>
  </div>
</div>

<script>
let allContribs = [];
let currentFilter = 'all';

// ─── 비밀번호 보기/숨기기 토글 ───
function togglePinVisibility() {
  const input = document.getElementById('pin-input');
  const icon = document.getElementById('eye-icon');
  if (!input || !icon) return;
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁️';
  }
  input.focus();
}

// ─── 로그인 ───
function getStoredPin() {
  try { return sessionStorage.getItem('damwatch_admin_pin') || ''; } catch(e) { return ''; }
}
function storePin(pin) {
  try { sessionStorage.setItem('damwatch_admin_pin', pin); } catch(e) {}
}
function clearPin() {
  try { sessionStorage.removeItem('damwatch_admin_pin'); } catch(e) {}
}

async function tryLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  const errEl = document.getElementById('login-err');
  if (!pin) {
    errEl.textContent = '비밀번호를 입력해 주세요.';
    return;
  }
  errEl.textContent = '확인 중...';

  try {
    const res = await fetch('/api/contrib?admin_pin=' + encodeURIComponent(pin));
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = '⚠️ ' + (data?.error || '로그인 실패');
      return;
    }
    // 성공
    storePin(pin);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    allContribs = data.contribs || [];
    renderAll();
  } catch (e) {
    errEl.textContent = '⚠️ ' + e.message;
  }
}

function logout() {
  clearPin();
  location.reload();
}

// ─── 자동 로그인 (페이지 새로고침 후) ───
async function autoLogin() {
  const pin = getStoredPin();
  if (!pin) return;
  try {
    const res = await fetch('/api/contrib?admin_pin=' + encodeURIComponent(pin));
    const data = await res.json();
    if (!res.ok) { clearPin(); return; }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    allContribs = data.contribs || [];
    renderAll();
  } catch (e) {}
}

// ─── 렌더링 ───
function escapeHTML(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatTime(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  if (isNaN(t)) return '';
  const now = Date.now();
  const diff = Math.floor((now - t.getTime()) / 1000);
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 2592000) return Math.floor(diff/86400) + '일 전';
  return t.toLocaleDateString();
}

function renderStats() {
  const total = allContribs.length;
  const hidden = allContribs.filter(c => c.is_hidden).length;
  const visible = total - hidden;
  const photos = allContribs.filter(c => c.type === 'photo').length;
  const reported = allContribs.filter(c => (c.report_count || 0) > 0).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-visible').textContent = visible;
  document.getElementById('stat-hidden').textContent = hidden;
  document.getElementById('stat-photos').textContent = photos;
  const reportedEl = document.getElementById('stat-reported');
  if (reportedEl) reportedEl.textContent = reported;
}

function renderList() {
  const list = document.getElementById('contrib-list');
  const filtered = allContribs.filter(c => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'reported') return (c.report_count || 0) > 0;
    if (currentFilter === 'visible') return !c.is_hidden;
    if (currentFilter === 'hidden') return c.is_hidden;
    if (currentFilter === 'photo') return c.type === 'photo';
    if (currentFilter === 'note') return c.type === 'note';
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">이 조건에 맞는 글이 없어요.</div>';
    return;
  }

  list.innerHTML = filtered.map(c => {
    const photoHTML = c.type === 'photo' && c.photo_url
      ? `<div class="photo" onclick="lightbox('${escapeHTML(c.photo_url)}')"><img src="${escapeHTML(c.photo_url)}" alt="" onerror="this.parentNode.classList.add('empty');this.style.display='none';this.parentNode.innerHTML='🖼️'"></div>`
      : `<div class="photo empty">📝</div>`;

    const hideBtn = c.is_hidden
      ? `<button class="unhide-btn" onclick="setHidden(${c.id}, false)">👁️ 다시 표시</button>`
      : `<button class="hide-btn" onclick="setHidden(${c.id}, true)">🙈 숨기기</button>`;

    return `
      <div class="card ${c.is_hidden ? 'hidden-card' : ''}" ${c.report_count > 0 ? 'style="border-color:rgba(255,100,120,0.5);"' : ''}>
        ${photoHTML}
        <div class="body">
          <div class="meta">
            <span class="dam-tag">${escapeHTML(c.dam_id)}</span>
            <span>#${c.id}</span>
            <span>·</span>
            <span>${c.type === 'photo' ? '📷 사진' : '📝 코멘트'}</span>
            <span>·</span>
            <span>${formatTime(c.created_at)}</span>
            ${c.is_hidden ? '<span style="color:var(--warn);">· 🙈 숨김 상태</span>' : ''}
            ${c.report_count > 0 ? `<span style="color:var(--danger);font-weight:700;">· 🚩 신고 ${c.report_count}건</span>` : ''}
          </div>
          <div class="nickname">🙋 ${escapeHTML(c.nickname || '익명')}</div>
          ${c.note ? `<div class="note">${escapeHTML(c.note)}</div>` : ''}
          <div class="actions">
            ${hideBtn}
            <button class="delete-btn" onclick="deleteContrib(${c.id})">🗑️ 영구 삭제</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderAll() {
  renderStats();
  renderList();
}

// ─── 필터 버튼 ───
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderList();
});

// ─── 액션: 숨김/복원 ───
async function setHidden(id, hidden) {
  const pin = getStoredPin();
  if (!pin) { logout(); return; }
  const action = hidden ? 'hide' : 'unhide';
  try {
    const res = await fetch(`/api/contrib?id=${id}&admin_pin=${encodeURIComponent(pin)}&action=${action}`, {
      method: 'PATCH'
    });
    const data = await res.json();
    if (!res.ok) { alert('⚠️ ' + (data?.error || 'failed')); return; }
    // 로컬 상태 업데이트
    const c = allContribs.find(x => x.id === id);
    if (c) c.is_hidden = hidden;
    renderAll();
  } catch (e) {
    alert('⚠️ ' + e.message);
  }
}

// ─── 액션: 영구 삭제 ───
async function deleteContrib(id) {
  if (!confirm(`#${id} 글을 영구 삭제할까요? 되돌릴 수 없어요.\n\n(숨기기를 권장합니다 — 숨겨도 데이터는 보존되고 언제든 복원 가능)`)) return;
  const pin = getStoredPin();
  if (!pin) { logout(); return; }
  try {
    const res = await fetch(`/api/contrib?id=${id}&admin_pin=${encodeURIComponent(pin)}`, {
      method: 'DELETE'
    });
    const data = await res.json();
    if (!res.ok) { alert('⚠️ ' + (data?.error || 'failed')); return; }
    allContribs = allContribs.filter(x => x.id !== id);
    renderAll();
  } catch (e) {
    alert('⚠️ ' + e.message);
  }
}

// ─── 큰 사진 보기 ───
function lightbox(url) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<img src="${url}" alt="">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

// ─── 초기 로드 ───
autoLogin();
</script>

</body>
</html>
