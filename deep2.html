<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>격자식 곱셈 · Lattice Multiplication</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080810;
  --surface: #10101c;
  --card: #16162a;
  --border: #252540;
  --text: #e8e8f8;
  --red: #ff4d6d;
  --teal: #00f5c4;
  --gold: #ffd166;
  --green: #06ffa5;
  --purple: #c77dff;
}

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.wrap {
  max-width: 1020px;
  margin: 0 auto;
  padding: 6px 10px 40px;
}

header {
  text-align: center;
  padding: 8px 0 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo-wrap {
  position: relative;
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.logo-wrap svg {
  width: 52px;
  height: 52px;
  border-radius: 50%;
}

.logo-glow {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  filter: blur(8px);
  transition: all .6s;
  pointer-events: none;
}

.logo-wrap.glowing svg {
  filter: drop-shadow(0 0 10px #00f5c4) drop-shadow(0 0 22px #ffd166);
}

.logo-wrap.glowing .logo-glow {
  background: radial-gradient(circle, rgba(0,245,196,.6) 0%, rgba(255,209,102,.3) 60%, transparent 100%);
}

@keyframes logoPulse {
  0%,100% { filter: drop-shadow(0 0 6px #00f5c4) drop-shadow(0 0 14px #ffd166); }
  50% { filter: drop-shadow(0 0 20px #ffd166) drop-shadow(0 0 40px #00f5c4); }
}

.logo-wrap.fanfare svg {
  animation: logoPulse .35s ease-in-out 6;
}

.title-block {
  text-align: left;
}

.title-ko {
  font-size: clamp(1.2rem, 5vw, 2rem);
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(90deg, var(--teal), var(--gold), var(--red));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.15;
}

.title-en {
  font-size: clamp(.65rem, 2.5vw, .9rem);
  font-weight: 700;
  color: #7878a8;
  letter-spacing: .5px;
  margin-top: 2px;
}

.subtitle-row {
  color: #a0a0c0;
  font-size: .75rem;
  margin-top: 4px;
  line-height: 1.7;
  text-align: center;
  padding: 0 4px;
}

.input-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.num-inputs {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.num-field {
  font-family: 'Space Mono', monospace;
  font-size: clamp(1.3rem, 5vw, 1.7rem);
  font-weight: 700;
  width: clamp(100px, 25vw, 130px);
  text-align: center;
  background: #0a0a16;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 12px 6px;
  outline: none;
  min-height: 52px;
}

.num-field:focus {
  border-color: var(--teal);
  box-shadow: 0 0 10px rgba(0,245,196,.4);
}

.times-sign {
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--red);
}

.btn-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}

.go-btn, .reset-btn {
  padding: 12px 20px;
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  cursor: pointer;
  min-height: 52px;
  touch-action: manipulation;
}

.go-btn {
  background: linear-gradient(135deg, #00f5c4, #06ffa5);
  color: #0a0a16;
  border: none;
  font-size: .95rem;
  box-shadow: 0 0 16px rgba(0,245,196,.4);
}

.reset-btn {
  background: linear-gradient(135deg, #444466, #2a2a44);
  color: #a0a0c8;
  border: 1px solid var(--border);
  font-size: .88rem;
  font-weight: 700;
}

.range-hint {
  text-align: center;
  font-size: .72rem;
  color: #6868a0;
  margin-top: 6px;
}

.input-error {
  text-align: center;
  font-size: .82rem;
  font-weight: 700;
  color: var(--red);
  margin-top: 5px;
  min-height: 1.2em;
}

@keyframes errShake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-6px); }
  40%,80% { transform: translateX(6px); }
}

.input-error.shake {
  animation: errShake .35s ease;
}

.controls {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
}

.playback {
  display: flex;
  gap: 8px;
  align-items: center;
}

.ctrl-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}

.ctrl-btn.active {
  background: var(--teal);
  color: var(--bg);
  border-color: var(--teal);
}

.ctrl-btn:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.slider-group {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  background: var(--surface);
  border-radius: 20px;
}

.slider-label {
  font-size: .8rem;
  color: #a0a0c0;
  white-space: nowrap;
  display: flex;
  gap: 4px;
  align-items: center;
}

input[type=range] {
  -webkit-appearance: none;
  width: 88px;
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--teal);
  cursor: pointer;
}

.slider-val {
  font-family: 'Space Mono', monospace;
  font-size: .85rem;
  color: var(--teal);
  min-width: 28px;
  text-align: center;
  font-weight: 700;
}

.step-indicator {
  font-family: 'Space Mono', monospace;
  font-size: .85rem;
  color: #a0a0c0;
  font-weight: 700;
  background: var(--surface);
  padding: 6px 12px;
  border-radius: 20px;
}

.stage {
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: flex-start;
}

.canvas-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.prob-title-row {
  position: relative;
  width: 100%;
  margin-bottom: 6px;
  min-height: 40px;
  text-align: center;
}

.prob-title {
  font-family: 'Space Mono', monospace;
  font-size: clamp(1rem, 4vw, 1.6rem);
  font-weight: 700;
  visibility: hidden;
  display: inline-block;
}

.prob-title .op {
  color: var(--red);
}

.canvas-area {
  display: flex;
  flex-direction: row;
  gap: 10px;
  width: 100%;
}

.canvas-wrapper {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  justify-content: center;
  padding: 4px 0;
}

#cv {
  border-radius: 8px;
  display: block;
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: .72rem;
  color: #a0a0c0;
  font-weight: 600;
  flex-shrink: 0;
  padding-top: 4px;
}

.leg {
  display: flex;
  align-items: flex-start;
  gap: 5px;
}

.leg-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-top: 3px;
}

.calc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  width: 260px;
  flex-shrink: 0;
}

#calc-rows {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 280px;
  overflow-y: auto;
}

.calc-card h3 {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #a0a0c0;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 8px;
}

.calc-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  font-family: 'Space Mono', monospace;
  font-size: .85rem;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity .3s, transform .3s;
}

.calc-row.show {
  opacity: 1;
  transform: translateX(0);
}

.c-eq {
  color: #9090b0;
}

.c-sum {
  color: var(--gold);
  font-weight: 700;
}

.c-carry {
  color: var(--red);
  font-size: .75rem;
}

.calc-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
  opacity: 0;
}

.calc-final {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  color: var(--green);
  opacity: 0;
  line-height: 1.4;
  display: none;
}

.calc-final.show {
  opacity: 1;
}

#confetti-cv {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
  display: none;
}

@media (max-width: 700px) {
  .wrap {
    padding: 4px 8px 24px;
  }
  
  .logo-wrap {
    width: 44px;
    height: 44px;
  }
  
  .logo-wrap svg {
    width: 44px;
    height: 44px;
  }
  
  .title-block {
    text-align: center;
  }
  
  .num-inputs {
    flex-direction: column;
  }
  
  .num-field {
    width: 130px;
    padding: 10px 6px;
    min-height: 48px;
    font-size: 1.3rem;
  }
  
  .ctrl-btn {
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
  }
  
  input[type=range] {
    width: 80px;
  }
  
  .stage {
    flex-direction: column;
  }
  
  .canvas-area {
    flex-direction: column;
  }
  
  .legend {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding-top: 10px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
  }
  
  .calc-card {
    width: 100%;
    margin-top: 8px;
  }
}

@media (max-width: 450px) {
  .num-field {
    width: 110px;
    font-size: 1.2rem;
  }
  
  .ctrl-btn {
    width: 40px;
    height: 40px;
    font-size: 1rem;
  }
  
  input[type=range] {
    width: 68px;
  }
}

@media (min-width: 701px) {
  .btn-row {
    display: contents;
  }
}
</style>
</head>
<body>

<canvas id="confetti-cv"></canvas>
<div class="wrap">
<header>
  <div class="header-inner">
    <div class="logo-wrap" id="logo-wrap">
      <div class="logo-glow"></div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="38" fill="url(#lg1)" stroke="#00a8cc" stroke-width="1.5"/>
        <defs><linearGradient id="lg1"><stop offset="0%" stop-color="#00b4d8"/><stop offset="100%" stop-color="#06ffa5"/></linearGradient></defs>
        <text x="40" y="45" font-family="monospace" font-size="28" font-weight="bold" fill="white" text-anchor="middle">✕</text>
      </svg>
    </div>
    <div class="title-block">
      <div class="title-ko">격자식 곱셈</div>
      <div class="title-en">Lattice Multiplication</div>
    </div>
  </div>
  <p class="subtitle-row">각 칸에 두 자리 곱을 채우고, 대각선 방향으로 합산, 받아올림</p>
</header>

<div class="input-panel">
  <div class="num-inputs">
    <div class="num-fields-wrap">
      <div class="num-fields-row">
        <input class="num-field" id="f1" type="number" placeholder="1234" inputmode="numeric"/>
        <span class="times-sign">×</span>
        <input class="num-field" id="f2" type="number" placeholder="5678" inputmode="numeric"/>
      </div>
      <div class="range-hint">1 ~ 9,999,999</div>
    </div>
    <div class="btn-row">
      <button class="go-btn" id="drawBtn">그리기 ▶</button>
      <button class="reset-btn" id="resetBtn">초기화 ↺</button>
    </div>
  </div>
  <div class="input-error" id="input-error"></div>
</div>

<div class="controls">
  <div class="playback">
    <button class="ctrl-btn" id="btn-prev" disabled>⏮</button>
    <button class="ctrl-btn" id="btn-play" disabled>▶</button>
    <button class="ctrl-btn" id="btn-next" disabled>⏭</button>
  </div>
  <span class="step-indicator" id="step-ind">— / —</span>
  <div class="slider-group">
    <span class="slider-label">⚡ 속도</span>
    <input type="range" id="speed-sl" min="1" max="5" value="3"/>
    <span class="slider-val" id="speed-val">3</span>
  </div>
  <div class="slider-group">
    <span class="slider-label">🔊 볼륨</span>
    <input type="range" id="vol-sl" min="0" max="10" value="5"/>
    <span class="slider-val" id="vol-val">5</span>
  </div>
</div>

<div class="stage">
  <div class="canvas-card">
    <div class="prob-title-row">
      <div class="prob-title" id="prob-title">
        <span id="pt1"></span><span class="op"> × </span><span id="pt2"></span>
      </div>
    </div>
    <div class="canvas-area">
      <div class="canvas-wrapper">
        <canvas id="cv"></canvas>
      </div>
      <div class="legend">
        <div class="leg"><span class="leg-dot" style="background:#67c7eb"></span><span>십의 자리</span></div>
        <div class="leg"><span class="leg-dot" style="background:#ffd166"></span><span>일의 자리</span></div>
        <div class="leg"><span class="leg-dot" style="background:#c77dff"></span><span>대각합</span></div>
      </div>
    </div>
  </div>
  <div class="calc-card">
    <h3>계산 과정</h3>
    <div id="calc-rows"></div>
    <hr class="calc-divider" id="calc-divider"/>
    <div class="calc-final" id="calc-final"></div>
  </div>
</div>
</div>

<script>
// 오디오
let AC = null;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

let VOL = 0.5;
function tone(f, dur, vol, tp = 'sine', dl = 0) {
  if (!VOL) return;
  const ac = getAC();
  if (ac.state === 'suspended') ac.resume();
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.connect(g);
  g.connect(ac.destination);
  o.type = tp;
  o.frequency.setValueAtTime(f, ac.currentTime + dl);
  g.gain.setValueAtTime(0, ac.currentTime + dl);
  g.gain.linearRampToValueAtTime(vol * VOL, ac.currentTime + dl + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dl + dur);
  o.start(ac.currentTime + dl);
  o.stop(ac.currentTime + dl + dur + 0.05);
}

function sndCell() { tone(440 + Math.random() * 60, 0.07, 0.08, 'triangle'); }
function sndDiag(i) { tone(540 + i * 45, 0.13, 0.1, 'sine'); }
function sndCarry() { tone(740, 0.09, 0.11, 'sine'); }
function sndFanfare() {
  [[523,0],[659,0.13],[784,0.26],[1047,0.4],[784,0.53],[1047,0.66],[1318,0.8]].forEach(([f,d]) => tone(f, 0.22, 0.12, 'triangle', d));
}

// 전역 변수
let steps = [], stepIdx = 0, isPlaying = false, autoId = null;
let curN1 = 0, curN2 = 0, d1 = [], d2 = [];
let GEO = null;
let rawDiag = [], finDiag = [], ND = 0;
let canvasState = null;
let CW = 0, CH = 0;
let carryAnimId = null, carryProgress = 0;

function digs(n) { return String(n).split('').map(Number); }

function calcDiags(d1, d2) {
  const cols = d1.length, rows = d2.length, nd = cols + rows;
  const raw = new Array(nd).fill(0);
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const p = d1[c] * d2[r];
      raw[c + r] += Math.floor(p / 10);
      raw[c + r + 1] += (p % 10);
    }
  }
  const fin = [...raw];
  for (let d = nd - 1; d > 0; d--) {
    if (fin[d] >= 10) {
      fin[d - 1] += Math.floor(fin[d] / 10);
      fin[d] %= 10;
    }
  }
  return { raw, fin, nd };
}

function freshState() {
  return { gridDrawn: false, cells: [], highlightCell: null, diagSet: new Set(), showCarry: false, showAnswer: false };
}

function render() {
  if (!GEO || !canvasState) return;
  const cv = document.getElementById('cv');
  if (!cv || CW === 0 || CH === 0) return;
  const ctx = cv.getContext('2d');
  const st = canvasState;
  const { cols, rows, C, ox, oy, gw, gh, GAP, BS, nd, diagStart } = GEO;

  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, CW, CH);

  if (st.gridDrawn) {
    ctx.strokeStyle = 'rgba(160,180,255,.9)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(ox, oy, gw, gh);
    ctx.strokeStyle = 'rgba(110,125,200,.5)';
    ctx.lineWidth = 1.2;
    for (let c = 1; c < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(ox + c * C, oy);
      ctx.lineTo(ox + c * C, oy + gh);
      ctx.stroke();
    }
    for (let r = 1; r < rows; r++) {
      ctx.beginPath();
      ctx.moveTo(ox, oy + r * C);
      ctx.lineTo(ox + gw, oy + r * C);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(140,155,230,.32)';
    ctx.lineWidth = 1;
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        ctx.beginPath();
        ctx.moveTo(ox + (c + 1) * C, oy + r * C);
        ctx.lineTo(ox + c * C, oy + (r + 1) * C);
        ctx.stroke();
      }
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.max(14, Math.round(C * 0.45))}px 'Space Mono', monospace`;
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = '#ff9f1c';
      ctx.fillText(d1[c], ox + c * C + C / 2, oy - 20);
    }
    const d2x = ox + gw + 26;
    for (let r = 0; r < rows; r++) {
      ctx.fillStyle = '#00f5c4';
      ctx.fillText(d2[r], d2x, oy + r * C + C / 2);
    }
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  st.cells.forEach(({ c, r }) => {
    const p = d1[c] * d2[r];
    const tens = Math.floor(p / 10), ones = p % 10;
    const cx = ox + c * C, cy = oy + r * C;
    ctx.font = `bold ${Math.max(11, Math.round(C * 0.28))}px 'Space Mono', monospace`;
    ctx.fillStyle = '#67c7eb';
    ctx.fillText(tens, cx + C * 0.28, cy + C * 0.30);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(ones, cx + C * 0.72, cy + C * 0.70);
  });

  if (st.highlightCell) {
    const { c, r } = st.highlightCell;
    ctx.strokeStyle = 'rgba(199,125,255,.9)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(ox + c * C + 1.5, oy + r * C + 1.5, C - 3, C - 3);
  }

  if (st.diagSet.size > 0) {
    for (let d = 0; d < nd; d++) {
      if (!st.diagSet.has(d)) continue;
      const val = rawDiag[d];
      const x = diagStart + d * C;
      const y = oy + gh + GAP + BS + 15;
      ctx.font = 'bold 15px "Space Mono", monospace';
      ctx.fillStyle = '#c77dff';
      ctx.fillText(val, x, y);
    }
  }

  if (st.showCarry) {
    const yBase = oy + gh + GAP + BS + 55;
    for (let d = 0; d < nd; d++) {
      const x = diagStart + d * C;
      ctx.font = 'bold 13px "Space Mono", monospace';
      if (rawDiag[d] !== finDiag[d]) {
        ctx.fillStyle = '#ffd166';
        ctx.fillText(rawDiag[d], x, yBase - 15);
        ctx.fillStyle = '#06ffa5';
        ctx.fillText(finDiag[d], x, yBase);
      } else {
        ctx.fillStyle = '#c77dff';
        ctx.fillText(rawDiag[d], x, yBase);
      }
    }
  }

  if (st.showAnswer) {
    const ansY = oy + gh + GAP + BS + (st.showCarry ? 110 : 70);
    ctx.font = 'bold 28px "Space Mono", monospace';
    ctx.fillStyle = '#06ffa5';
    ctx.textAlign = 'center';
    ctx.fillText('∴ ' + (curN1 * curN2), CW / 2, ansY);
  }
}

function addCalcRow(d) {
  if (document.getElementById('cr-' + d)) return;
  const cols = d1.length, rows = d2.length;
  const points = [];
  for (let c = 0; c < cols; c++) {
    const rT = d - c;
    if (rT >= 0 && rT < rows) {
      points.push({ v: Math.floor(d1[c] * d2[rT] / 10), color: '#67c7eb' });
    }
    const rO = d - 1 - c;
    if (rO >= 0 && rO < rows) {
      points.push({ v: d1[c] * d2[rO] % 10, color: '#ffd166' });
    }
  }
  const raw = rawDiag[d], fin = finDiag[d];
  const row = document.createElement('div');
  row.className = 'calc-row';
  row.id = 'cr-' + d;
  const addendsHtml = points.length ? points.map(p => '<span style="color:' + p.color + ';font-weight:700;">' + p.v + '</span>').join('<span class="c-eq">+</span>') : '<span style="color:#7070a0">0</span>';
  row.innerHTML = addendsHtml + '<span class="c-eq">=</span><span class="c-sum">' + raw + '</span>' + (raw !== fin ? '<span class="c-carry"> →' + fin + '</span>' : '');
  document.getElementById('calc-rows').appendChild(row);
  setTimeout(() => row.classList.add('show'), 10);
}

function doFinal(silent = false) {
  canvasState.showAnswer = true;
  document.getElementById('calc-divider').style.opacity = '1';
  const fe = document.getElementById('calc-final');
  fe.innerHTML = '<div>' + curN1 + ' × ' + curN2 + '</div><div style="font-size:1.2rem;">∴ ' + (curN1 * curN2) + '</div>';
  fe.style.display = 'block';
  setTimeout(() => fe.classList.add('show'), 10);
  if (!silent) {
    sndFanfare();
    const logo = document.getElementById('logo-wrap');
    logo.classList.add('fanfare', 'glowing');
    setTimeout(() => logo.classList.remove('fanfare'), 2300);
    setTimeout(() => logo.classList.remove('glowing'), 4200);
  }
}

function buildSteps() {
  const list = [];
  const cols = d1.length, rows = d2.length;
  list.push({ t: 'grid' });
  for (let k = 0; k < cols + rows - 1; k++) {
    for (let c = 0; c < cols; c++) {
      const r = k - c;
      if (r >= 0 && r < rows) list.push({ t: 'cell', c, r });
    }
  }
  for (let d = 0; d < ND; d++) list.push({ t: 'diag', d });
  if (rawDiag.some((v, i) => v !== finDiag[i])) list.push({ t: 'carry' });
  list.push({ t: 'final' });
  return list;
}

function applyStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  const s = steps[idx];
  if (s.t === 'grid') canvasState.gridDrawn = true;
  if (s.t === 'cell') {
    canvasState.cells.push({ c: s.c, r: s.r });
    canvasState.highlightCell = { c: s.c, r: s.r };
    sndCell();
  }
  if (s.t === 'diag') {
    canvasState.highlightCell = null;
    canvasState.diagSet.add(s.d);
    sndDiag(s.d);
    addCalcRow(s.d);
  }
  if (s.t === 'carry') {
    canvasState.showCarry = true;
    sndCarry();
  }
  if (s.t === 'final') doFinal();
  render();
  updateUI();
}

function rebuildState(upTo) {
  canvasState = freshState();
  document.getElementById('calc-rows').innerHTML = '';
  document.getElementById('calc-divider').style.opacity = '0';
  document.getElementById('calc-final').style.display = 'none';
  document.getElementById('calc-final').classList.remove('show');
  for (let i = 0; i < upTo; i++) {
    const s = steps[i];
    if (s.t === 'grid') canvasState.gridDrawn = true;
    if (s.t === 'cell') {
      canvasState.cells.push({ c: s.c, r: s.r });
      canvasState.highlightCell = { c: s.c, r: s.r };
    }
    if (s.t === 'diag') {
      canvasState.highlightCell = null;
      canvasState.diagSet.add(s.d);
      addCalcRow(s.d);
    }
    if (s.t === 'carry') canvasState.showCarry = true;
    if (s.t === 'final') doFinal(true);
  }
  render();
  updateUI();
}

function stepForward() {
  if (stepIdx < steps.length) {
    applyStep(stepIdx);
    stepIdx++;
  }
}

function stepBack() {
  if (stepIdx > 0) {
    stepIdx--;
    rebuildState(stepIdx);
  }
}

function togglePlay() {
  const ac = getAC();
  if (ac.state === 'suspended') ac.resume();
  isPlaying = !isPlaying;
  const btn = document.getElementById('btn-play');
  btn.textContent = isPlaying ? '⏸' : '▶';
  btn.classList.toggle('active', isPlaying);
  if (isPlaying) startAutoPlay();
  else stopAutoPlay();
}

function startAutoPlay() {
  stopAutoPlay();
  function tick() {
    if (!isPlaying || stepIdx >= steps.length) {
      isPlaying = false;
      document.getElementById('btn-play').textContent = '▶';
      document.getElementById('btn-play').classList.remove('active');
      return;
    }
    stepForward();
    autoId = setTimeout(tick, SPEED_MS);
  }
  autoId = setTimeout(tick, SPEED_MS);
}

function stopAutoPlay() {
  if (autoId) {
    clearTimeout(autoId);
    autoId = null;
  }
}

function updateUI() {
  const tot = steps.length;
  document.getElementById('step-ind').textContent = stepIdx + ' / ' + tot;
  document.getElementById('btn-prev').disabled = stepIdx === 0;
  document.getElementById('btn-next').disabled = stepIdx >= tot;
  if (stepIdx >= tot && isPlaying) {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶';
    document.getElementById('btn-play').classList.remove('active');
    stopAutoPlay();
  }
}

function initDraw() {
  const v1 = parseInt(document.getElementById('f1').value);
  const v2 = parseInt(document.getElementById('f2').value);
  const errEl = document.getElementById('input-error');
  
  if (isNaN(v1) || isNaN(v2)) {
    errEl.textContent = '⚠ 숫자를 입력해 주세요';
    return;
  }
  if (v1 < 1 || v2 < 1 || v1 > 9999999 || v2 > 9999999) {
    errEl.textContent = '⚠ 1 이상 9,999,999 이하만 가능합니다';
    return;
  }
  errEl.textContent = '';
  
  if (carryAnimId) cancelAnimationFrame(carryAnimId);
  stopAutoPlay();
  isPlaying = false;
  
  curN1 = v1;
  curN2 = v2;
  d1 = digs(v1);
  d2 = digs(v2);
  
  document.getElementById('pt1').textContent = v1;
  document.getElementById('pt2').textContent = v2;
  document.getElementById('prob-title').style.visibility = 'visible';
  document.getElementById('calc-rows').innerHTML = '';
  document.getElementById('calc-divider').style.opacity = '0';
  document.getElementById('calc-final').style.display = 'none';
  document.getElementById('calc-final').classList.remove('show');
  
  const res = calcDiags(d1, d2);
  rawDiag = res.raw;
  finDiag = res.fin;
  ND = res.nd;
  
  const canvasCard = document.querySelector('.canvas-card');
  const maxWidth = Math.min(700, (canvasCard ? canvasCard.clientWidth - 20 : 380));
  const PAD = 18;
  const d2LabelW = 44;
  const GAP = 10, BS = 22;
  const rows = d2.length, cols = d1.length;
  let C = Math.floor((maxWidth - 2 * PAD - d2LabelW) / (cols + 2 * rows));
  C = Math.max(36, Math.min(C, 85));
  const gw = cols * C, gh = rows * C;
  const leftSpace = PAD + rows * C;
  const rightSpace = PAD + (cols - 1) * C + d2LabelW;
  const sideSpace = Math.max(leftSpace, rightSpace);
  CW = 2 * sideSpace + cols * C;
  const ox = sideSpace;
  const diagStart = CW / 2 - (ND - 1) * C / 2;
  const oy = 48;
  const hasCarry = rawDiag.some((v, i) => v !== finDiag[i]);
  CH = oy + gh + (hasCarry ? 180 : 120) + 40;
  
  const cv = document.getElementById('cv');
  cv.width = CW;
  cv.height = CH;
  cv.style.width = CW + 'px';
  cv.style.height = CH + 'px';
  
  GEO = { cols, rows, C, ox, oy, gw, gh, GAP, BS, nd: ND, diagStart };
  steps = buildSteps();
  stepIdx = 0;
  canvasState = freshState();
  
  document.getElementById('btn-play').disabled = false;
  document.getElementById('btn-next').disabled = false;
  document.getElementById('btn-prev').disabled = true;
  
  render();
  updateUI();
  
  isPlaying = true;
  document.getElementById('btn-play').textContent = '⏸';
  document.getElementById('btn-play').classList.add('active');
  startAutoPlay();
}

function resetAll() {
  stopAutoPlay();
  if (carryAnimId) cancelAnimationFrame(carryAnimId);
  isPlaying = false;
  document.getElementById('btn-play').textContent = '▶';
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-play').disabled = true;
  document.getElementById('btn-next').disabled = true;
  document.getElementById('btn-prev').disabled = true;
  document.getElementById('step-ind').textContent = '— / —';
  document.getElementById('f1').value = '';
  document.getElementById('f2').value = '';
  document.getElementById('input-error').textContent = '';
  document.getElementById('prob-title').style.visibility = 'hidden';
  document.getElementById('calc-rows').innerHTML = '';
  document.getElementById('calc-divider').style.opacity = '0';
  document.getElementById('calc-final').style.display = 'none';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  steps = [];
  stepIdx = 0;
  GEO = null;
  canvasState = null;
}

// 이벤트 연결
document.getElementById('drawBtn').onclick = initDraw;
document.getElementById('resetBtn').onclick = resetAll;
document.getElementById('btn-prev').onclick = stepBack;
document.getElementById('btn-play').onclick = togglePlay;
document.getElementById('btn-next').onclick = stepForward;

document.getElementById('speed-sl').oninput = function(e) {
  const val = parseInt(e.target.value);
  const map = {1:550, 2:330, 3:220, 4:110, 5:40};
  SPEED_MS = map[val];
  document.getElementById('speed-val').textContent = val;
  if (isPlaying) startAutoPlay();
};

document.getElementById('vol-sl').oninput = function(e) {
  VOL = parseInt(e.target.value) / 10;
  document.getElementById('vol-val').textContent = e.target.value;
};

document.getElementById('f1').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('f2').focus();
});
document.getElementById('f2').addEventListener('keydown', e => {
  if (e.key === 'Enter') initDraw();
});

let SPEED_MS = 220;
let resizeTimer;
window.addEventListener('resize', () => {
  if (!curN1 || !curN2) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const wasPlaying = isPlaying;
    if (wasPlaying) {
      stopAutoPlay();
      isPlaying = false;
    }
    initDraw();
    if (wasPlaying && stepIdx < steps.length) {
      isPlaying = true;
      document.getElementById('btn-play').textContent = '⏸';
      document.getElementById('btn-play').classList.add('active');
      startAutoPlay();
    }
  }, 200);
});
</script>
